name: Guardian Vault Tests
on:
  push:
    branches: ["main", "feature/guardian-vault-v0.1"]
    paths: ["guardian-vault/**", ".github/workflows/guardian-vault-tests.yml"]
  pull_request:
    paths: ["guardian-vault/**", ".github/workflows/guardian-vault-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=44.0.0"
      - run: python -m unittest discover -s guardian-vault -p "test_*.py" -v
